<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>待办</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="todo.css" />
  </head>
  <body>
    <div class="page todo-page">
      <header class="todo-topbar">
        <div class="todo-heading">
          <h1>待办</h1>
          <span id="todoPageCount" aria-live="polite">0 项</span>
        </div>
        <div class="todo-topbar-actions">
          <a class="work-button link-button" href="./">返回提醒</a>
          <button class="new-button" id="newTodoButton" type="button">
            <svg aria-hidden="true"><use href="#icon-plus"></use></svg>
            新建
          </button>
        </div>
      </header>

      <main class="todo-main">
        <nav class="todo-tabs" aria-label="待办视图">
          <button type="button" data-todo-view="open" aria-pressed="true">未完成 <span data-todo-count="open">0</span></button>
          <button type="button" data-todo-view="history" aria-pressed="false">历史 <span data-todo-count="history">0</span></button>
        </nav>

        <section class="todo-list" id="todoList" aria-live="polite" aria-label="待办列表"></section>
        <div class="todo-empty" id="todoEmpty" hidden>
          <strong id="todoEmptyTitle">没有未完成的待办</strong>
          <button class="text-button" id="emptyNewTodoButton" type="button">添加一项</button>
        </div>
      </main>
    </div>

    <dialog class="todo-dialog" id="todoDialog" aria-labelledby="todoDialogTitle">
      <form id="todoForm">
        <div class="todo-dialog-head">
          <h2 id="todoDialogTitle">新建待办</h2>
          <button class="todo-icon-button" id="closeTodoDialog" type="button" aria-label="关闭" title="关闭">
            <svg aria-hidden="true"><use href="#icon-x"></use></svg>
          </button>
        </div>
        <input id="todoId" type="hidden" />
        <label class="todo-field">
          <span>内容</span>
          <input id="todoTitle" maxlength="120" autocomplete="off" required />
        </label>
        <label class="todo-field">
          <span>优先级</span>
          <select id="todoPriority">
            <option value="normal">普通</option>
            <option value="high">高</option>
            <option value="low">低</option>
          </select>
        </label>
        <label class="todo-field">
          <span>截止时间</span>
          <input id="todoDueAt" type="datetime-local" />
        </label>
        <label class="todo-field">
          <span>备注</span>
          <textarea id="todoNote" maxlength="1600" rows="5"></textarea>
        </label>
        <div class="todo-dialog-actions">
          <button class="todo-delete" id="deleteTodoButton" type="button" hidden>删除</button>
          <span></span>
          <button class="cancel-button" id="cancelTodoDialog" type="button">取消</button>
          <button class="save-button" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <div class="todo-toast" id="todoToast" role="status" aria-live="polite" aria-atomic="true"></div>

    <svg hidden aria-hidden="true">
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="icon-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
      <symbol id="icon-pencil" viewBox="0 0 24 24"><path d="m4 20 4.2-1 10.6-10.6a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z" /><path d="m14.5 7 3 3" /></symbol>
      <symbol id="icon-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6" /></symbol>
      <symbol id="icon-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
    </svg>

    <script src="todo-core.js"></script>
    <script src="work-history-core.js"></script>
    <script src="clipboard-core.js"></script>
    <script src="state-client.js"></script>
    <script src="todo.js"></script>
  </body>
</html>
