<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>部门WBS · EntropyCamp</title><link rel="stylesheet" href="wbs.css"></head>
<body><header><div><a class="back-link" href="./" aria-label="返回提醒">← 返回</a><h1>部门任务</h1></div><nav><a href="performance.html">飞书任务 ↗</a></nav></header>
<main><div class="toolbar"><label>项目 <select id="project"></select></label><label>查看 <select id="view"><option value="wbs">WBS · 卡片视图</option><option value="tree">WBS · 关系图</option><option value="cpm">CPM · 依赖关系</option><option value="gantt">甘特 · 剩余工期</option><option value="links">飞书对账</option></select></label><label>范围 <select id="scope"><option value="">父TASK总览</option></select></label><label>负责人 <select id="owner"><option value="">全部人员</option><option value="__none">未接取</option></select></label><label>状态 <select id="status"><option value="">全部状态</option><option>待接取</option><option>已接取·待开始</option><option>待排期</option><option>待分拣</option><option>进行中</option><option>待验收</option><option>已完成</option><option>已取消</option></select></label><label class="search">搜索 <input id="search" type="search" placeholder="编号、标题或子Issue"></label><label class="check"><input type="checkbox" id="hideDone" checked>隐藏已结束任务</label></div>
<div class="meta"><span id="syncInfo">正在读取任务…</span><span id="counts"></span></div><details class="connection-panel" id="connectionPanel"><summary id="authSummary">Linear连接与数据更新</summary><p id="authStatus">正在检查登录状态…</p><div class="actions"><button id="login">登录Linear</button><button id="refresh">刷新Linear任务</button><button id="reloadLocal">重新载入本机数据</button><button id="logout" hidden>退出本机登录</button></div><details><summary>首次配置 / 备用方式</summary><p>首次由管理员登记EntropyCamp的OAuth应用；之后点“登录Linear”即可，只申请读取权限。</p><div class="actions"><button id="connection">配置OAuth应用</button><button id="copySync">复制AI更新请求</button></div></details></details><div id="notice" role="status" hidden></div><div id="health"></div><div id="content"></div></main>
<aside id="detail" hidden><div class="aside-head"><strong id="detailTitle"></strong><button id="closeDetail" aria-label="关闭详情">×</button></div><div id="detailBody"></div></aside>
<dialog id="settings"><form id="settingsForm"><h2>配置Linear登录</h2><p>在Linear的OAuth应用设置中登记以下回调地址，仅需Client ID，不需要Client Secret。</p><code>http://127.0.0.1:8765/api/wbs/oauth/callback</code><label>应用Client ID<input id="clientId" autocomplete="off" required placeholder="首次登记后填写一次"></label><p id="configured"></p><div class="actions"><button type="button" id="cancelSettings">取消</button><button>保存应用配置</button></div></form></dialog>
<dialog id="preview"><h2>刷新预览 · 仅更新本机镜像</h2><div id="previewBody"></div><div class="actions"><button id="cancelImport">取消</button><button id="applyImport">以Linear为准更新</button></div></dialog>
<dialog id="request"><h2>交给当前AI更新</h2><textarea id="requestText" rows="12" readonly></textarea><div class="actions"><button id="closeRequest">关闭</button><button id="copyRequest">复制</button></div></dialog>
<script src="wbs-core.js"></script><script src="wbs.js"></script></body></html>
