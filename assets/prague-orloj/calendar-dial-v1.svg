      <g data-zodiac="taurus" transform="translate(607 348)"><use href="#zodiacBase"/><path d="M-24 2q24-24 48 0v24h-48Z"/><path d="M-20-1-32-20m52 19 12-19M-31-20q12 1 17 12m45-12Q19-19 14-8" fill="none" stroke="#6b3427" stroke-width="6"/></g>
      <g data-zodiac="gemini" transform="translate(677 417)"><use href="#zodiacBase"/><circle cx="-12" cy="-16" r="8"/><circle cx="12" cy="-16" r="8"/><path d="M-21-4q9-10 18 0v28h-18Zm24 0q9-10 18 0v28H3ZM-3 4h6"/></g>
      <g data-zodiac="cancer" transform="translate(702 512)"><use href="#zodiacBase"/><ellipse cx="0" cy="8" rx="22" ry="15"/><path d="M-18 0-31-15m12 8-17 4M18 0l31-15M19-7l17 4M-15 18l-14 10m44-10 14 10" fill="none" stroke-width="6"/></g>
