      <g data-zodiac="libra" transform="translate(512 701)"><use href="#zodiacBase"/><path d="M0-24v44M-26-11h52M-20-8l-9 22h18Zm40 0-9 22h18ZM-15 25h30" fill="none" stroke="#6b3427" stroke-width="6"/></g>
