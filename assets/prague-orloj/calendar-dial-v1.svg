<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Prague Orloj calendar dial</title>
  <desc id="desc">A layered, front-facing reconstruction of the Manes calendar plate with twelve seasonal scenes, zodiac medallions, the Old Town emblem, and a 365-day ring.</desc>
  <defs>
    <radialGradient id="silver" cx="38%" cy="30%" r="76%">
      <stop offset="0" stop-color="#eee9d6"/>
      <stop offset=".38" stop-color="#b8b6a8"/>
      <stop offset=".72" stop-color="#77776f"/>
      <stop offset="1" stop-color="#343735"/>
    </radialGradient>
    <radialGradient id="gold" cx="36%" cy="28%" r="78%">
      <stop offset="0" stop-color="#f7df88"/>
      <stop offset=".38" stop-color="#c69a42"/>
      <stop offset=".72" stop-color="#81602a"/>
      <stop offset="1" stop-color="#3d2e1e"/>
    </radialGradient>
    <linearGradient id="blueEnamel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6f75"/>
      <stop offset=".5" stop-color="#1d4249"/>
      <stop offset="1" stop-color="#10282e"/>
    </linearGradient>
    <linearGradient id="winePaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c4f43"/>
      <stop offset=".52" stop-color="#542c2d"/>
      <stop offset="1" stop-color="#271d24"/>
    </linearGradient>
    <linearGradient id="greenPaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#657151"/>
      <stop offset=".55" stop-color="#35443a"/>
      <stop offset="1" stop-color="#17282a"/>
    </linearGradient>
    <filter id="plateShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
      <feOffset dy="9" result="offset"/>
      <feFlood flood-color="#080907" flood-opacity=".72"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="patina" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".021 .037" numOctaves="3" seed="1410" result="noise"/>
      <feColorMatrix in="noise" values=".28 0 0 0 .2  0 .25 0 0 .18  0 0 .22 0 .11  0 0 0 .38 0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <filter id="softRelief" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#160d08" flood-opacity=".7"/>
    </filter>
    <clipPath id="plateClip"><circle cx="512" cy="512" r="503"/></clipPath>
    <g id="monthBase">
      <circle r="74" fill="url(#winePaint)" stroke="#e4c56d" stroke-width="8"/>
      <circle r="64" fill="none" stroke="#211c1b" stroke-opacity=".55" stroke-width="3"/>
    </g>
    <g id="zodiacBase">
      <circle r="43" fill="#d4ad55" stroke="#3c2d1b" stroke-width="6"/>
      <circle r="35" fill="#d9bb6f" stroke="#fff1a7" stroke-opacity=".42" stroke-width="2"/>
    </g>
  </defs>

  <g filter="url(#plateShadow)">
    <circle cx="512" cy="512" r="503" fill="#171b1a" stroke="#070908" stroke-width="18"/>
    <circle cx="512" cy="512" r="482" fill="url(#silver)" stroke="#d6ccad" stroke-width="7"/>
    <circle cx="512" cy="512" r="448" fill="none" stroke="#2b302e" stroke-width="34"/>
    <circle cx="512" cy="512" r="448" pathLength="365" fill="none" stroke="#e5ddc7" stroke-width="27" stroke-dasharray=".38 .62"/>
    <circle cx="512" cy="512" r="416" fill="none" stroke="#6c6659" stroke-width="5"/>
    <circle cx="512" cy="512" r="402" fill="url(#gold)" stroke="#29221c" stroke-width="10"/>
    <circle cx="512" cy="512" r="388" fill="#c59b47" fill-opacity=".2" stroke="#f0d984" stroke-width="4"/>

