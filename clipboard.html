<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>多剪贴板</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="clipboard.css" />
  </head>
  <body>
    <div class="page clipboard-page">
      <header class="clipboard-topbar">
        <div class="clipboard-heading">
          <h1>多剪贴板</h1>
          <span class="clipboard-count" id="clipboardCount" aria-live="polite">0 条</span>
        </div>
        <div class="clipboard-topbar-actions">
          <a class="work-button link-button" href="./">返回提醒</a>
          <button class="new-button" id="newClipButton" type="button">
            <svg aria-hidden="true"><use href="#icon-plus"></use></svg>
            新建
          </button>
        </div>
      </header>

      <main class="clipboard-main">
        <section class="clipboard-toolbar" aria-label="剪贴板筛选">
          <label class="clipboard-search" for="clipSearch">
            <svg aria-hidden="true"><use href="#icon-search"></use></svg>
            <span class="visually-hidden">搜索剪贴内容</span>
            <input id="clipSearch" type="search" autocomplete="off" placeholder="搜索标题或内容" />
            <button class="clipboard-search-clear" id="clearClipSearch" type="button" aria-label="清空搜索" title="清空搜索" hidden>
              <svg aria-hidden="true"><use href="#icon-x"></use></svg>
            </button>
          </label>
          <div class="clipboard-filter" role="group" aria-label="格式筛选">
            <button class="is-active" type="button" data-format-filter="all" aria-pressed="true">全部</button>
            <button type="button" data-format-filter="text" aria-pressed="false">TXT</button>
            <button type="button" data-format-filter="markdown" aria-pressed="false">MD</button>
          </div>
        </section>

        <section class="clip-grid" id="clipGrid" aria-live="polite" aria-label="已保存的剪贴内容"></section>
        <div class="clipboard-empty" id="clipboardEmpty" hidden>
          <strong id="clipboardEmptyTitle">还没有剪贴内容</strong>
          <button class="text-button" id="emptyNewClipButton" type="button">新建一条</button>
        </div>
      </main>
    </div>

    <dialog class="clipboard-dialog" id="clipDialog" aria-labelledby="clipDialogTitle">
      <form id="clipForm">
        <div class="clipboard-dialog-head">
          <h2 id="clipDialogTitle">新建剪贴</h2>
          <button class="clipboard-icon-button" id="closeClipDialog" type="button" aria-label="关闭" title="关闭">
            <svg aria-hidden="true"><use href="#icon-x"></use></svg>
          </button>
        </div>

        <input id="clipId" type="hidden" />
        <label class="clipboard-field">
          <span>标题</span>
          <input id="clipTitle" maxlength="80" autocomplete="off" placeholder="留空时取正文第一行" />
        </label>

        <fieldset class="clipboard-format-field">
          <legend>保存格式</legend>
          <div class="clipboard-format-options">
            <label>
              <input type="radio" name="clipFormat" value="text" checked />
              <span>TXT 原样</span>
            </label>
            <label>
              <input type="radio" name="clipFormat" value="markdown" />
              <span>Markdown</span>
            </label>
          </div>
        </fieldset>

        <label class="clipboard-field clipboard-content-field">
          <span>内容</span>
          <textarea id="clipContent" maxlength="300000" spellcheck="true" required></textarea>
        </label>

        <div class="clipboard-dialog-actions">
          <button class="clipboard-dialog-delete" id="deleteClipFromDialog" type="button" hidden>删除</button>
          <span></span>
          <button class="cancel-button" id="cancelClipDialog" type="button">取消</button>
          <button class="save-button" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <div class="clipboard-toast" id="clipboardToast" role="status" aria-live="polite" aria-atomic="true"></div>

    <svg hidden aria-hidden="true">
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></symbol>
      <symbol id="icon-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" /></symbol>
      <symbol id="icon-pencil" viewBox="0 0 24 24"><path d="m4 20 4.2-1 10.6-10.6a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z" /><path d="m14.5 7 3 3" /></symbol>
      <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M12 17v5M6 3h12l-2 6 3 3v2H5v-2l3-3-2-6Z" /></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" /></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
    </svg>

    <script src="clipboard-core.js"></script>
    <script src="work-history-core.js"></script>
    <script src="state-client.js"></script>
    <script src="clipboard.js"></script>
  </body>
</html>
