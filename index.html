            <time class="visually-hidden" id="bernZytgloggeClockTime" aria-live="off"></time>

              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10l-2.5-2.5M17 17H7l2.5 2.5M18 7l-1.5 1.5M6 17l1.5-1.5" /></svg>
            </button>

            <span class="visually-hidden" id="clockSkinStatus" aria-live="polite"></span>
          </div>
          <div class="title-group">
            <h1>提醒</h1>
            <div class="work-summary" id="workSummary" aria-live="polite">
              <span>未上班</span>
              <strong>0</strong>
              <small>次完成</small>
            </div>
            <div class="wall-clock" aria-label="当前北京时间">
              <time class="wall-clock-time" id="currentTime" datetime=""></time>
              <span class="wall-clock-date" id="currentDate"></span>
            </div>
            <a class="daily-quote" id="dailyQuote" href="https://hitokoto.cn/" target="_blank" rel="noreferrer" aria-live="polite">
              <span class="daily-quote-text" id="dailyQuoteText">把眼前这一小时做好。</span>
              <small class="daily-quote-source" id="dailyQuoteSource">本地</small>
            </a>
            <section class="weather-widget" id="weatherWidget" aria-label="未来一周天气">
              <div class="weather-widget-head">
                <span class="weather-location" id="weatherLocation">天气</span>
                <small class="weather-status" id="weatherStatus">加载中</small>
              </div>
              <div class="weather-days" id="weatherDays"></div>
            </section>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="work-button" id="workToggleButton" type="button">上班</button>
          <a class="work-button link-button" href="work-log.html">日报</a>
          <a class="work-button link-button" href="history.html">历史</a>
          <a class="work-button link-button" href="clipboard.html">剪贴板</a>
          <div class="feishu-quick-control" id="feishuQuickControl">
            <button class="feishu-settings-trigger" id="feishuSettingsButton" type="button" aria-haspopup="dialog">
              <span class="feishu-status-dot" aria-hidden="true"></span>
              <span>飞书</span>
            </button>
            <label class="feishu-quick-switch" title="开启飞书提醒">
              <input id="feishuQuickEnabled" type="checkbox" aria-label="开启飞书提醒" />
              <span class="feishu-quick-switch-track" aria-hidden="true"></span>
            </label>
          </div>
          <button class="new-button" id="newCardButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            新建
          </button>
        </div>
      </header>

      <main>
        <section class="card-grid card-graph" id="cardGrid" aria-label="提醒关系图" aria-live="polite"></section>
      </main>
    </div>

    <dialog class="card-dialog" id="cardDialog">
      <form id="cardForm">
        <div class="dialog-header">
          <h2 id="dialogTitle">新建提醒</h2>
          <button class="close-button" id="closeDialogButton" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>

        <input id="cardId" type="hidden" />

        <label class="field">
          <span>名称</span>
          <input id="cardTitle" maxlength="48" placeholder="例如：起来活动" required autofocus />
        </label>

        <label class="field">
          <span>标签</span>
          <input id="cardTag" maxlength="16" placeholder="可选" />
        </label>

        <label class="field codex-field">
          <span>Codex 对话</span>
          <select id="codexThread" aria-describedby="codexStatus">
            <option value="">不关联</option>
          </select>
          <small class="field-status" id="codexStatus">正在读取对话…</small>
        </label>

        <fieldset class="interval-field" id="intervalField">
          <legend>开始后，多久亮起</legend>
          <div>
            <input id="repeatValue" type="number" min="1" max="999" value="30" required aria-label="重复间隔数值" />
            <select id="repeatUnit" aria-label="重复间隔单位">
              <option value="minute">分钟</option>
              <option value="hour">小时</option>
              <option value="day">天</option>
            </select>
          </div>
        </fieldset>

        <div class="dialog-actions">
          <button class="delete-button" id="deleteCardButton" type="button" hidden>删除</button>
          <span></span>
          <button class="cancel-button" id="cancelDialogButton" type="button">取消</button>
          <button class="save-button" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog class="feishu-dialog" id="feishuDialog" aria-labelledby="feishuDialogTitle">
      <form id="feishuForm">
        <div class="feishu-dialog-head">
          <div>
            <span>消息通知</span>
            <h2 id="feishuDialogTitle">飞书提醒</h2>
            <p>任务状态变化由本地服务可靠发送，断网后会自动补发。</p>
          </div>
          <button class="reflection-close" id="closeFeishuDialog" type="button" aria-label="关闭飞书设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>

        <div class="feishu-connection" id="feishuConnection">
          <span class="feishu-connection-mark" aria-hidden="true"></span>
          <div>
            <strong id="feishuConnectionTitle">正在读取配置</strong>
            <small id="feishuConnectionDetail">请稍候…</small>
          </div>
          <label class="feishu-master-switch">
            <input id="feishuEnabled" type="checkbox" />
            <span aria-hidden="true"></span>
            <b>启用</b>
          </label>
        </div>

        <section class="feishu-credentials" aria-labelledby="feishuCredentialTitle">
          <div class="feishu-section-title">
            <div>
              <span>连接信息</span>
              <h3 id="feishuCredentialTitle">自定义机器人</h3>
            </div>
            <small>只保存在这台电脑</small>
          </div>
          <label class="feishu-field">
            <span>Webhook 地址</span>
            <input id="feishuWebhook" type="password" autocomplete="off" spellcheck="false" placeholder="已保存时留空即可" />
          </label>
          <label class="feishu-field">
            <span>签名密钥</span>
            <input id="feishuSecret" type="password" autocomplete="off" spellcheck="false" placeholder="已保存时留空即可" />
          </label>
        </section>

        <fieldset class="feishu-events">
          <legend>什么时候通知</legend>
          <label>
            <input type="checkbox" name="feishuEvent" value="codex_completed" checked />
            <span><strong>Codex 完成</strong><small>关联任务出现新的完整回复</small></span>
          </label>
          <label>
            <input type="checkbox" name="feishuEvent" value="work_ended" checked />
            <span><strong>下班总结</strong><small>发送工时、完成次数和今日感受</small></span>
          </label>
          <label>
            <input type="checkbox" name="feishuEvent" value="work_started" />
            <span><strong>开始上班</strong><small>确认提醒和工作计数已经启动</small></span>
          </label>
          <label>
            <input type="checkbox" name="feishuEvent" value="reminder_due" />
            <span><strong>普通提醒到点</strong><small>非 Codex 计时卡片亮起时发送</small></span>
          </label>
          <label>
            <input type="checkbox" name="feishuEvent" value="card_read" />
            <span><strong>标记已读</strong><small>卡片处理完成时同步一条状态</small></span>
          </label>
        </fieldset>

        <div class="feishu-form-status" id="feishuFormStatus" role="status" aria-live="polite"></div>
        <div class="feishu-dialog-actions">
          <button class="cancel-button" id="testFeishuButton" type="button">发送测试消息</button>
          <span></span>
          <button class="save-button" id="saveFeishuButton" type="submit">保存设置</button>
        </div>
      </form>
    </dialog>

    <dialog class="work-reflection-dialog" id="workReflectionDialog" aria-labelledby="workReflectionTitle">
      <form id="workReflectionForm">
        <div class="reflection-head">
          <div>
            <span>今日收尾</span>
            <h2 id="workReflectionTitle">准备下班</h2>
          </div>
          <button class="reflection-close" id="closeWorkReflection" type="button" aria-label="继续上班" title="继续上班">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>

        <div class="reflection-summary" aria-label="本次班次摘要">
          <div>
            <span>上班</span>
            <strong id="reflectionStartedAt">--:--</strong>
          </div>
          <div>
            <span>工作时长</span>
            <strong id="reflectionDuration">00:00:00</strong>
          </div>
          <div>
            <span>完成对话</span>
            <strong><b id="reflectionCount">0</b> 次</strong>
          </div>
        </div>

        <section class="reflection-conversations" aria-labelledby="reflectionConversationsTitle">
          <div class="reflection-section-head">
            <div>
              <span>班次资料</span>
              <h3 id="reflectionConversationsTitle">保存哪些 Codex 对话</h3>
            </div>
            <button class="text-button" id="toggleReflectionThreads" type="button">全选</button>
          </div>
          <p>历史中只保存对话引用和班次时间，不复制聊天正文。</p>
          <div class="reflection-thread-list" id="workReflectionThreads" aria-label="选择要保存到历史的 Codex 对话"></div>
          <small class="reflection-thread-count" id="workReflectionThreadCount">0 个对话</small>
        </section>

        <fieldset class="reflection-moods">
          <legend>今天的状态</legend>
          <div class="reflection-mood-grid">
            <label style="--mood-color: #8fd1a7">
              <input type="radio" name="workMood" value="fulfilled" />
              <span class="mood-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 9.5 17 19 7.5" /></svg></span>
              <strong>充实</strong>
            </label>
            <label style="--mood-color: #85b9ef">
              <input type="radio" name="workMood" value="focused" />
              <span class="mood-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" /><circle cx="12" cy="12" r="2" /></svg></span>
              <strong>专注</strong>
            </label>
            <label style="--mood-color: #c7cbd1">
              <input type="radio" name="workMood" value="steady" />
              <span class="mood-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M5 15h14" /></svg></span>
              <strong>平稳</strong>
            </label>
            <label style="--mood-color: #e9bf72">
              <input type="radio" name="workMood" value="inspired" />
              <span class="mood-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3Z" /></svg></span>
              <strong>有灵感</strong>
            </label>
            <label style="--mood-color: #aa9bd1">
              <input type="radio" name="workMood" value="tired" />
              <span class="mood-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9h3M14 9h3M8 16h8" /></svg></span>
              <strong>疲惫</strong>
            </label>
            <label style="--mood-color: #df8b83">
              <input type="radio" name="workMood" value="stressed" />
              <span class="mood-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8.5h2M14 8.5h2M8 17c2.2-2.1 5.8-2.1 8 0" /></svg></span>
              <strong>有压力</strong>
            </label>
          </div>
        </fieldset>

        <label class="reflection-note">
          <span>留一点想法</span>
          <textarea id="workReflectionNote" maxlength="1600" rows="5" placeholder="今天做成了什么，卡在哪里，明天想继续什么…"></textarea>
        </label>
        <div class="reflection-status" id="workReflectionStatus" role="status" aria-live="polite"></div>
        <div class="reflection-actions">
          <button class="cancel-button" id="cancelWorkReflection" type="button">继续上班</button>
          <button class="save-button" id="confirmWorkReflection" type="submit">保存记录并下班</button>
        </div>
      </form>
    </dialog>

    <script src="card-order-core.js"></script>
    <script src="work-history-core.js"></script>
    <script src="app.js"></script>
  </body>
</html>
